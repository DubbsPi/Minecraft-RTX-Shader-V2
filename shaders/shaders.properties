# Main menu
screen = [LIGHTING] [SKY] [REFLECTIONS] [WATER] [RTX_FEATURES]


# Lighting
screen.LIGHTING = [SUN] [SHADOWS]

# Sun
screen.SUN = SUN_PATH_ROTATION SSS_STRENGTH
sliders = SUN_PATH_ROTATION SSS_STRENGTH

# Shadows
screen.SHADOWS = SHADOW_MAP_RESOLUTION SHADOW_SAMPLES PCSS_BLOCKER_SAMPLES PIXELATED_SHADOWS SHADOW_PIXELS_PER_BLOCK VARIABLE_PENUMBRA_SHADOWS FIXED_SHADOW_RADIUS
sliders = SHADOW_MAP_RESOLUTION SHADOW_SAMPLES PCSS_BLOCKER_SAMPLES SHADOW_PIXELS_PER_BLOCK FIXED_SHADOW_RADIUS

# Sky
screen.SKY = [VANILLA_SKY] [SUN_SKY] [NIGHT_SKY] SKY_VIEW_STEPS SKY_LIGHT_STEPS

screen.VANILLA_SKY = VANILLA_CLOUDS VANILLA_SUN VANILLA_MOON VANILLA_STARS
sliders = VANILLA_CLOUDS SKY_VIEW_STEPS SKY_LIGHT_STEPS

screen.SUN_SKY = SUN_PATH_ROTATION SUN_CORONA
sliders = SUN_PATH_ROTATION SUN_CORONA

screen.NIGHT_SKY = GALATIC_HAZE GALAXY_WIDTH GALAXY_BRIGHTNESS NEBULA NEBULA_BRIGHTNESS NEBULA_BAND_BIAS NEBULA_SCALE NEBULA_WARP NEBULA_THRESHOLD
sliders = GALAXY_WIDTH GALAXY_BRIGHTNESS NEBULA_BRIGHTNESS NEBULA_BAND_BIAS NEBULA_SCALE NEBULA_WARP NEBULA_THRESHOLD

# Water
screen.WATER = WATER_PIXELATED SHADOW_PIXELS_PER_BLOCK WATER_REFLECTION_STRENGTH
sliders = SHADOW_PIXELS_PER_BLOCK WATER_REFLECTION_STRENGTH

# Reflections
screen.REFLECTIONS = SSR_STEPS SSR_REFINE_STEPS SSR_THICKNESS
sliders = SSR_STEPS SSR_REFINE_STEPS SSR_THICKNESS

# RTX Features
screen.RTX_FEATURES = RTX_FEATURES MAX_DIST
sliders = MAX_DIST


# Iris settings
#if VANILLA_CLOUDS == 2
clouds = fancy
#elif VANILLA_CLOUDS == 1
clouds = fast
#else
clouds = off
#endif

#ifdef VANILLA_SUN
sun = true
#else
sun = false
#endif

#ifdef VANILLA_MOON
moon = true
#else
moon = false
#endif

sky = false

blend.gbuffers_water.colortex5 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex6 = off

backFace.solid = true
backFace.cutout = true
backFace.cutoutMipped = true
backFace.translucent = true
frustum.culling = true
occlusion.culling = true

shadow.culling = false

iris.features.required = CUSTOM_IMAGES SSBO COMPUTE_SHADERS

shadowTerrain = true
shadowTranslucent = true
shadowEntities = true
shadowPlayer = true
shadowBlockEntities = true


# Custom images
image.taaTexture = taaTextureSampler rgba rgba16f HALF_FLOAT false true 1.0 1.0
image.reflectionAccum = reflectionAccumSampler rgba rgba16f HALF_FLOAT false true 1.0 1.0

image.skyLut = skyLutSampler rgba rgb10_a2 UNSIGNED_INT_2_10_10_10_REV false false 4096 4096

#if MAX_TRIS == 4194304
    image.vertexPositions = vertexPositionsSampler rg_integer rg32ui UNSIGNED_INT false false 4096 4096
#elif MAX_TRIS == 2359296
    image.vertexPositions = vertexPositionsSampler rg_integer rg32ui UNSIGNED_INT false false 3072 3072
#elif MAX_TRIS == 1048576
    image.vertexPositions = vertexPositionsSampler rg_integer rg32ui UNSIGNED_INT false false 2048 2048
#elif MAX_TRIS == 589824
    image.vertexPositions = vertexPositionsSampler rg_integer rg32ui UNSIGNED_INT false false 1536 1536
#elif MAX_TRIS == 262144
    image.vertexPositions = vertexPositionsSampler rg_integer rg32ui UNSIGNED_INT false false 1024 1024
#endif

# Custom SSBOs
# Vertex counts
bufferObject.0 = 4


# Compute shaders
allowConcurrentCompute = false
program.begin.enabled = RTX_FEATURES


# Custom uniforms
variable.float.sunDirWx = gbufferModelViewInverse.0.0 * sunPosition.x + gbufferModelViewInverse.1.0 * sunPosition.y + gbufferModelViewInverse.2.0 * sunPosition.z
variable.float.sunDirWy = gbufferModelViewInverse.0.1 * sunPosition.x + gbufferModelViewInverse.1.1 * sunPosition.y + gbufferModelViewInverse.2.1 * sunPosition.z
variable.float.sunDirWz = gbufferModelViewInverse.0.2 * sunPosition.x + gbufferModelViewInverse.1.2 * sunPosition.y + gbufferModelViewInverse.2.2 * sunPosition.z
variable.float.sunDirWLength = sqrt(sunDirWx * sunDirWx + sunDirWy * sunDirWy + sunDirWz * sunDirWz)
uniform.vec3.sunDirW = vec3(sunDirWx / sunDirWLength, sunDirWy / sunDirWLength, sunDirWz / sunDirWLength)

variable.float.moonDirWx = gbufferModelViewInverse.0.0 * moonPosition.x + gbufferModelViewInverse.1.0 * moonPosition.y + gbufferModelViewInverse.2.0 * moonPosition.z
variable.float.moonDirWy = gbufferModelViewInverse.0.1 * moonPosition.x + gbufferModelViewInverse.1.1 * moonPosition.y + gbufferModelViewInverse.2.1 * moonPosition.z
variable.float.moonDirWz = gbufferModelViewInverse.0.2 * moonPosition.x + gbufferModelViewInverse.1.2 * moonPosition.y + gbufferModelViewInverse.2.2 * moonPosition.z
variable.float.moonDirWLength = sqrt(moonDirWx * moonDirWx + moonDirWy * moonDirWy + moonDirWz * moonDirWz)
uniform.vec3.moonDirW = vec3(moonDirWx / moonDirWLength, moonDirWy / moonDirWLength, moonDirWz / moonDirWLength)

uniform.float.moonPhaseMult = if(moonPhase == 0, 1.0, moonPhase == 1 || moonPhase == 7, 0.75, moonPhase == 2 || moonPhase == 6, 0.5, moonPhase == 3 || moonPhase == 5, 0.25, 0.025)

variable.float.nightFactorT = clamp(1.0 - (sunDirW.y + 0.12) / 0.16, 0.0, 1.0)
uniform.float.nightFactor = nightFactorT * nightFactorT * (3.0 - 2.0 * nightFactorT)

uniform.float.sunMuS = max(sunDirW.y, 0.03)
uniform.float.moonMuS = max(moonDirW.y, 0.03)

variable.float.sunLightFadeT = clamp((sunDirW.y + 0.02) / 0.1, 0.0, 1.0)
uniform.float.sunLightFade = sunLightFadeT * sunLightFadeT * (3.0 - 2.0 * sunLightFadeT)
variable.float.moonLightFadeT = clamp((moonDirW.y + 0.08) / 0.1, 0.0, 1.0)
uniform.float.moonLightFade = moonLightFadeT * moonLightFadeT * (3.0 - 2.0 * moonLightFadeT)

uniform.float.moonSkyIntensity = 0.3 * mix(0.1, 1.0, moonPhaseMult)
variable.float.moonWashFactorT = clamp(moonDirW.y / 0.4, 0.0, 1.0)
uniform.float.moonWashFactor = 1.0 - 0.7 * moonPhaseMult * moonWashFactorT * moonWashFactorT * (3.0 - 2.0 * moonWashFactorT)

uniform.float.skyY0 = max(cameraPosition.y - 63.0, 0.0) + 1.0

variable.float.e1Dot = moonDirW.x
variable.float.e2Dot = cos(radians(15.0)) * moonDirW.y - sin(radians(15.0)) * moonDirW.z
variable.float.moonSpinA = -(atan2(e2Dot, e1Dot) + pi * 0.25) * 0.7
uniform.vec2.moonSpin = vec2(cos(moonSpinA), sin(moonSpinA))
