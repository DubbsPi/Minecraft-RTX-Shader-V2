# Main menu
screen = [LIGHTING] [SKY] [REFLECTIONS] [WATER]


# Lighting
screen.LIGHTING = [SHADOWS]

# Shadows
screen.SHADOWS = SHADOW_MAP_RESOLUTION SHADOW_SAMPLES PIXELATED_SHADOWS SHADOW_PIXELS_PER_BLOCK VARIABLE_PENUMBRA_SHADOWS FIXED_SHADOW_RADIUS

# Sky
screen.SKY = [VANILLA_SKY] [SUN_SKY] [NIGHT_SKY] SKY_VIEW_STEPS SKY_LIGHT_STEPS
screen.VANILLA_SKY = VANILLA_CLOUDS VANILLA_SUN VANILLA_MOON VANILLA_STARS
screen.SUN_SKY = SUN_PATH_ROTATION SUN_CORONA
screen.NIGHT_SKY = GALAXY_WIDTH GALAXY_BRIGHTNESS NEBULA_BRIGHTNESS NEBULA_BAND_BIAS

# Water
screen.WATER = WATER_PIXELATED SHADOW_PIXELS_PER_BLOCK

# Reflections
screen.REFLECTIONS = SSR_STEPS SSR_REFINE_STEPS

# Sliders
sliders = SHADOW_MAP_RESOLUTION SHADOW_SAMPLES SHADOW_PIXELS_PER_BLOCK FIXED_SHADOW_RADIUS
sliders = VANILLA_CLOUDS SKY_VIEW_STEPS SKY_LIGHT_STEPS
sliders = SSR_STEPS SSR_REFINE_STEPS


# Iris settings
#if VANILLA_CLOUDS == 2
clouds = fancy
#elif VANILLA_CLOUDS == 1
clouds = fast
#else
clouds = off
#endif

#ifdef VANILLA_SUN
sun = true
#else
sun = false
#endif

#ifdef VANILLA_MOON
moon = true
#else
moon = false
#endif

sky = false

blend.gbuffers_water.colortex5 = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_water.colortex6 = off

backFace.solid = true
backFace.cutout = true
backFace.cutoutMipped = true
backFace.translucent = true
frustum.culling = true
occlusion.culling = true

shadow.culling = true
